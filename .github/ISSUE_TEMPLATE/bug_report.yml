name: Bug report
description: Something in codemap-ai does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not paste private source code; a small example that shows the problem is best.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands and a minimal code example (files and their content).
      placeholder: |
        1. Create `a.py` with ...
        2. Run `npx codemap-ai init`
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command output or error message.
      render: text
  - type: input
    id: version
    attributes:
      label: codemap-ai version
      description: Output of `npx codemap-ai --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.11, macOS 15
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the analyzed code
      multiple: true
      options:
        - Python
        - TypeScript
        - JavaScript
        - Other / not language specific
